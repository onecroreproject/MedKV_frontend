<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zoom SDK Frame</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        #zoom-root {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        /* Contain all Zoom SDK children inside the viewport */
        #zoom-root > div {
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
        }
    </style>
    <!-- Use standard CDN for Zoom Meeting SDK 3.8.0 -->
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/react-dom.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/redux-thunk.min.js"></script>
    <script src="https://source.zoom.us/3.8.0/lib/vendor/lodash.min.js"></script>
    <script src="https://source.zoom.us/zoom-meeting-embedded-3.8.0.min.js"></script>
</head>
<body>
    <div id="zoom-root"></div>
    <script>
        console.log('[Zoom Frame] loaded');
        if (window.ZoomMtgEmbedded) {
            console.log('[Zoom Frame] SDK loaded');
        } else {
            console.error('[Zoom Frame] SDK NOT loaded');
        }

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'INIT_ZOOM') return;

            console.log('[Zoom Frame] received credentials');
            const { signature, sdkKey, appKey, meetingNumber, passcode, userName, userEmail, customerKey, zak } = event.data.payload;

            try {
                const client = window.ZoomMtgEmbedded.createClient();
                const meetingRoot = document.getElementById('zoom-root');

                const containerW = document.documentElement.clientWidth;
                const containerH = document.documentElement.clientHeight;
                console.log('[Zoom Frame] container dimensions:', containerW, 'x', containerH);
                console.log('[Zoom Frame] window inner dimensions:', window.innerWidth, 'x', window.innerHeight);
                console.log('[Zoom Frame] init started');
                client.init({
                    zoomAppRoot: meetingRoot,
                    language: 'en-US',
                    customize: {
                        video: {
                            isResizable: false,
                            viewSizes: {
                                default: { width: containerW, height: containerH }
                            }
                        }
                    }
                }).then(() => {
                    console.log('[Zoom Frame] init success');
                    console.log('[Zoom Frame] join started');
                    client.join({
                        signature: signature,
                        sdkKey: sdkKey || appKey, // Zoom SDK 3.8.0 strictly requires this parameter
                        meetingNumber: meetingNumber,
                        password: passcode,
                        userName: userName,
                        userEmail: userEmail,
                        customerKey: customerKey,
                        zak: zak
                    }).then(() => {
                        console.log('[Zoom Frame] join success');
                        window.parent.postMessage({ type: 'ZOOM_JOINED' }, '*');
                        // Keep Zoom SDK responsive on window resize
                        window.addEventListener('resize', function() {
                            try {
                                client.setVideoSize({ width: window.innerWidth, height: window.innerHeight });
                            } catch(e) { /* ignore if not supported */ }
                        });
                    }).catch((e) => {
                        console.error('[Zoom Frame] join error', e);
                        window.parent.postMessage({ type: 'ZOOM_ERROR', error: e }, '*');
                    });
                }).catch((e) => {
                    console.error('[Zoom Frame] init error', e);
                    window.parent.postMessage({ type: 'ZOOM_ERROR', error: e }, '*');
                });
            } catch (err) {
                console.error('[Zoom SDK Init Error Inside Iframe]', err);
                window.parent.postMessage({ type: 'ZOOM_ERROR', error: err.message }, '*');
            }
        });
    </script>
</body>
</html>
